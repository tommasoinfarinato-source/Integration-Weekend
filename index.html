<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il tuo programma del weekend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151832;
    --paper:#FBF8F2;
    --paper-dim:#F0ECE2;
    --muted:#6B7080;
    --ven:#E5007D;
    --ven-soft:#FBD9EC;
    --sab:#049DA6;
    --sab-soft:#D3EFF0;
    --dom:#F2A93B;
    --dom-soft:#FCEAC8;
    --line: rgba(21,24,50,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--ink);
    color: var(--ink);
    font-family:'Manrope', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 40px 16px 64px;
    overflow-x:hidden;
  }
  .stage{
    width:100%;
    max-width: 560px;
    position:relative;
  }
  .stage::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(circle at 12% 8%, rgba(229,0,125,0.16), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(4,157,166,0.18), transparent 42%),
      var(--ink);
  }
  .ticket{
    background: var(--paper);
    border-radius: 20px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
    overflow:hidden;
    position:relative;
  }
  #checkin{ padding: 40px 32px 36px; }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom: 6px;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background: var(--ven);
    display:inline-block;
    flex:none;
  }
  .brand span{
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--muted);
    font-weight:600;
  }
  h1.headline{
    font-family:'Archivo Black', sans-serif;
    font-weight:400;
    font-size: 44px;
    line-height: 0.98;
    margin: 4px 0 14px;
    color: var(--ink);
  }
  h1.headline em{
    font-style:normal;
    color: var(--ven);
  }
  .lede{
    font-size:16px;
    line-height:1.55;
    color: var(--muted);
    max-width: 42ch;
    margin: 0 0 30px;
  }
  .field-label{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
    display:block;
  }
  .name-row{
    display:flex;
    gap:10px;
  }
  input#nameInput{
    flex:1;
    font-family:'Manrope', sans-serif;
    font-size:18px;
    font-weight:600;
    padding: 15px 16px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: white;
    color: var(--ink);
    outline:none;
    min-width:0;
  }
  input#nameInput:focus{
    border-color: var(--ven);
  }
  button#goBtn{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:16px;
    padding: 0 22px;
    border-radius: 12px;
    border:none;
    background: var(--ink);
    color: var(--paper);
    cursor:pointer;
    transition: transform .12s ease, background .12s ease;
    flex:none;
  }
  button#goBtn:hover{ background:#000; }
  button#goBtn:active{ transform: scale(0.96); }
  .roster{
    margin-top:16px;
    font-size:13px;
    color: var(--muted);
    line-height:1.7;
  }
  .roster b{ color:var(--ink); }
  .error-msg{
    margin-top:10px;
    font-size:14px;
    color: var(--ven);
    font-weight:700;
    min-height:18px;
  }
  .overview-link{
    display:block;
    margin-top:22px;
    background:none;
    border:none;
    padding:0;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    color: var(--sab);
    cursor:pointer;
    text-align:left;
  }
  .overview-link:hover{ text-decoration: underline; }
  #pass{ display:none; }
  .pass-head{
    padding: 30px 28px 22px;
    position:relative;
    border-bottom: 2px dashed var(--line);
  }
  .backlink{
    background:none;
    border:none;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    color: var(--muted);
    cursor:pointer;
    padding:0;
    margin-bottom:18px;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .backlink:hover{ color: var(--ink); }
  .pass-head h2{
    font-family:'Archivo Black', sans-serif;
    font-weight:400;
    font-size:32px;
    margin:0 0 6px;
    color:var(--ink);
    word-break: break-word;
  }
  .pass-head p{
    margin:0;
    color:var(--muted);
    font-size:15px;
  }
  .pass-head .tally{
    margin-top:16px;
    display:flex;
    gap:18px;
    flex-wrap:wrap;
  }
  .tally-item{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }
  .tally-item .n{
    font-family:'Archivo Black', sans-serif;
    font-size:20px;
    margin-right:5px;
  }
  .tabs{
    display:flex;
    padding: 18px 20px 0;
    gap:8px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 4px 12px;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.01em;
    border:none;
    background:transparent;
    color: var(--muted);
    cursor:pointer;
    border-bottom: 3px solid transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .tab .emj{ font-size:18px; }
  .tab.active{ color: var(--ink); }
  .tab[data-day="venerdi"].active{ border-color: var(--ven); }
  .tab[data-day="sabato"].active{ border-color: var(--sab); }
  .tab[data-day="domenica"].active{ border-color: var(--dom); }
  .tab .badge{
    font-family:'Manrope',sans-serif;
    font-size:11px;
    font-weight:800;
    padding:1px 6px;
    border-radius:20px;
    background: var(--paper-dim);
    color: var(--muted);
  }
  .tab.active[data-day="venerdi"] .badge{ background:var(--ven-soft); color:var(--ven); }
  .tab.active[data-day="sabato"] .badge{ background:var(--sab-soft); color:var(--sab); }
  .tab.active[data-day="domenica"] .badge{ background:var(--dom-soft); color:#9c6a11; }
  .daypanel{
    padding: 20px 22px 30px;
    display:none;
  }
  .daypanel.active{ display:block; }
  .task-row{
    display:flex;
    gap:14px;
    padding: 16px 14px;
    border-radius:14px;
    margin-bottom:10px;
    align-items:flex-start;
    background: var(--paper-dim);
  }
  .task-row .icon{
    width:38px;height:38px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    flex:none;
    background:white;
  }
  .task-row .body{ min-width:0; flex:1; }
  .task-row .body .t{
    font-weight:800;
    font-size:15px;
    color:var(--ink);
    margin-bottom:3px;
    line-height:1.3;
  }
  .task-row .body .mates{
    font-size:13px;
    color: var(--muted);
    line-height:1.4;
  }
  .task-row .body .mates b{ color:var(--ink); font-weight:700; }
  .task-row .body .mates.unfilled{ color:#B45309; font-weight:700; }
  [data-day="venerdi"] .task-row .icon{ box-shadow: inset 0 0 0 2px var(--ven-soft); }
  [data-day="sabato"] .task-row .icon{ box-shadow: inset 0 0 0 2px var(--sab-soft); }
  [data-day="domenica"] .task-row .icon{ box-shadow: inset 0 0 0 2px var(--dom-soft); }
  .empty-state{
    padding: 30px 16px;
    text-align:center;
  }
  .empty-state .emj{ font-size:30px; display:block; margin-bottom:10px; }
  .empty-state .t{ font-weight:800; font-size:16px; color:var(--ink); margin-bottom:4px; }
  .empty-state .s{ font-size:14px; color:var(--muted); max-width:32ch; margin:0 auto; line-height:1.5; }
  .foot{
    padding: 16px 22px 26px;
    border-top: 1px solid var(--line);
    font-size:12px;
    color: var(--muted);
    text-align:center;
  }
  @media (max-width:420px){
    h1.headline{ font-size:36px; }
    .pass-head h2{ font-size:26px; }
    #checkin{ padding:32px 22px 30px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="ticket" id="checkin">
    <div class="brand"><span class="dot"></span><span>ESN &middot; WEEKEND</span></div>
    <h1 class="headline">Il tuo <em>programma</em><br>del weekend.</h1>
    <p class="lede">Scrivi il tuo nome e ti mostro solo i turni e i compiti che riguardano te, venerdì, sabato e domenica.</p>

    <label class="field-label" for="nameInput">Come ti chiami?</label>
    <div class="name-row">
      <input id="nameInput" type="text" placeholder="es. Roberta" list="namesList" autocomplete="off">
      <datalist id="namesList"></datalist>
      <button id="goBtn">Entra</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>

    <div class="roster">
      <b>Squadra:</b> <span id="rosterList"></span>
    </div>

    <button class="overview-link" id="overviewLink">Oppure vedi il programma generale, con tutti i compiti &rarr;</button>
  </div>

  <div class="ticket" id="pass">
    <div class="pass-head">
      <button class="backlink" id="backBtn">&larr; cambia nome</button>
      <h2 id="passName">Ciao!</h2>
      <p id="passSub">Ecco cosa devi fare questo weekend.</p>
      <div class="tally" id="tally"></div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab" data-day="venerdi"><span class="emj">🚌</span>Venerdì<span class="badge" id="badge-venerdi">0</span></button>
      <button class="tab" data-day="sabato"><span class="emj">🎒</span>Sabato<span class="badge" id="badge-sabato">0</span></button>
      <button class="tab" data-day="domenica"><span class="emj">🐰</span>Domenica<span class="badge" id="badge-domenica">0</span></button>
    </div>

    <div class="daypanel" data-day="venerdi" id="panel-venerdi"></div>
    <div class="daypanel" data-day="sabato" id="panel-sabato"></div>
    <div class="daypanel" data-day="domenica" id="panel-domenica"></div>

    <div class="foot">Se qualcosa non torna, fatti sentire nel gruppo — meglio sistemarlo prima di venerdì.</div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   ZONA DA MODIFICARE — tutto quello che ti serve è qui sotto.
   Non serve capire il codice: segui solo il formato di ogni riga.
   Il resto del file (più in basso) non va toccato.
   ══════════════════════════════════════════════════════════════════ */

// 1) CHI FA PARTE DELLA SQUADRA — un nome per riga.
//    Aggiungi o togli righe liberamente.
const PERSONE = `
Tommaso
Virginia
Roberta
Greta
Filippo
Francesca
Daniele
Andrea
Alessandro
`;

// 2) SOPRANNOMI — se qualcuno viene chiamato con un nome diverso
//    (es. nel gruppo WhatsApp), scrivi: Soprannome = Nome ufficiale
//    Deve essere un nome già presente nella lista PERSONE qui sopra.
const SOPRANNOMI = `
Tommy = Tommaso
Virgi = Virginia
Lagis = Alessandro
Fralina = Francesca
`;

// 3) IL PROGRAMMA — ogni riga è un compito, in questo formato:
//    emoji | titolo del compito | Nome1, Nome2, Nome3
//
//    - Se nessuno è ancora assegnato, lascia vuoto dopo l'ultimo "|"
//    - I nomi dei giorni (VENERDI / SABATO / DOMENICA) vanno scritti
//      da soli, in maiuscolo, su una riga tutta loro, per aprire un
//      nuovo giorno.
//    - Per aggiungere un compito, copia una riga esistente e modificala.
//    - Per toglierlo, cancella l'intera riga.
const PROGRAMMA = `
VENERDI
💰 | Raccolta cauzione — Bus 1 | Tommaso, Greta
💰 | Raccolta cauzione — Bus 2 | Virginia, Roberta
🎫 | Braccialetti — Bus 1 | Alessandro
🎫 | Braccialetti — Bus 2 | Francesca
🎮 | Supporto integration games | Filippo
🫧 | Supporto foam party | Daniele, Roberta
🍹 | Preparazione botellon | Francesca, Andrea, Roberta
🎁 | Materiali (partybags) | Da vedere
🧹 | Gestione botellon — alcol, pulizia, rientro materiali | Greta, Roberta, Daniele, Filippo

SABATO
🥪 | Ritiro pranzo a sacco | Francesca, Greta, Roberta
🗺️ | City tour — Gruppo 1 | Daniele, Alessandro
🗺️ | City tour — Gruppo 2 | Filippo, Tommaso
🎁 | Materiali (partybags) | Da vedere
🍹 | Preparazione botellon | Francesca, Daniele, Andrea
🧹 | Gestione botellon — alcol, pulizia, rientro materiali | Greta, Roberta, Daniele, Alessandro

DOMENICA
🐰 | Caccia al tesoro | Da vedere
🚌 | Partenza | stessi bus dell'andata
`;

/* ══════════════════════════════════════════════════════════════════
   Da qui in giù è il motore che legge i dati sopra e fa funzionare
   la pagina. Non serve modificarlo.
   ══════════════════════════════════════════════════════════════════ */
(function(){

  const DAY_LABELS = { venerdi: "Venerdì", sabato: "Sabato", domenica: "Domenica" };
  const DAY_KEYS_BY_NAME = { "VENERDI":"venerdi", "SABATO":"sabato", "DOMENICA":"domenica" };

  function normalize(s){
    return s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }

  // ---- parsing PERSONE ----
  const PEOPLE = PERSONE.split("\n").map(l => l.trim()).filter(Boolean);

  // ---- parsing SOPRANNOMI ----
  const ALIASES = {};
  SOPRANNOMI.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
    const parts = line.split("=");
    if(parts.length === 2){
      const nick = parts[0].trim();
      const real = parts[1].trim();
      if(nick) ALIASES[normalize(nick)] = real;
    }
  });

  const NAME_LOOKUP = {};
  PEOPLE.forEach(p => NAME_LOOKUP[normalize(p)] = p);
  Object.keys(ALIASES).forEach(k => NAME_LOOKUP[k] = ALIASES[k]);

  const OVERVIEW_TRIGGERS = ["generale","tutti","staff","team","overview","programma generale"];

  // ---- parsing PROGRAMMA ----
  const DAYS = { venerdi: {label:"Venerdì", tasks:[]}, sabato: {label:"Sabato", tasks:[]}, domenica: {label:"Domenica", tasks:[]} };
  let currentDay = null;
  PROGRAMMA.split("\n").forEach(rawLine => {
    const line = rawLine.trim();
    if(!line) return;
    if(DAY_KEYS_BY_NAME[line.toUpperCase()]){
      currentDay = DAY_KEYS_BY_NAME[line.toUpperCase()];
      return;
    }
    if(!currentDay) return;
    const parts = line.split("|");
    if(parts.length < 2) return;
    const icon = (parts[0] || "").trim();
    const title = (parts[1] || "").trim();
    const peopleStr = (parts[2] || "").trim();
    const people = peopleStr ? peopleStr.split(",").map(s => s.trim()).filter(Boolean) : [];
    if(title) DAYS[currentDay].tasks.push({ icon, title, people });
  });

  // ---------- Elementi ----------
  const input = document.getElementById("nameInput");
  const goBtn = document.getElementById("goBtn");
  const backBtn = document.getElementById("backBtn");
  const errorMsg = document.getElementById("errorMsg");
  const checkin = document.getElementById("checkin");
  const pass = document.getElementById("pass");
  const passName = document.getElementById("passName");
  const passSub = document.getElementById("passSub");
  const tally = document.getElementById("tally");
  const rosterList = document.getElementById("rosterList");
  const namesList = document.getElementById("namesList");
  const overviewLink = document.getElementById("overviewLink");

  rosterList.textContent = PEOPLE.join(", ");
  PEOPLE.concat(["Generale"]).forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    namesList.appendChild(opt);
  });

  function findPerson(raw){
    const key = normalize(raw);
    if(!key) return null;
    if(NAME_LOOKUP[key]) return NAME_LOOKUP[key];
    const matches = Object.keys(NAME_LOOKUP).filter(k => k.startsWith(key));
    const uniquePeople = [...new Set(matches.map(k => NAME_LOOKUP[k]))];
    if(uniquePeople.length === 1) return uniquePeople[0];
    return null;
  }

  function buildPanel(dayKey, person){
    const day = DAYS[dayKey];
    const panel = document.getElementById("panel-" + dayKey);
    panel.innerHTML = "";

    if(person === null){
      day.tasks.forEach(t => {
        const matesText = t.people.length
          ? `Assegnato a <b>${t.people.join(", ")}</b>`
          : `Da assegnare`;
        const row = document.createElement("div");
        row.className = "task-row";
        row.innerHTML = `
          <div class="icon">${t.icon}</div>
          <div class="body">
            <div class="t">${t.title}</div>
            <div class="mates${t.people.length ? "" : " unfilled"}">${matesText}</div>
          </div>`;
        panel.appendChild(row);
      });
      return;
    }

    const myTasks = day.tasks.filter(t => t.people.includes(person));

    if(dayKey === "domenica" && day.tasks.every(t => t.people.length === 0)){
      panel.innerHTML = `
        <div class="empty-state">
          <span class="emj">🐰</span>
          <div class="t">Turni non ancora assegnati</div>
          <div class="s">Per ora la domenica è aperta a tutti — appena i ruoli sono decisi, questa scheda si aggiorna.</div>
        </div>`;
      return;
    }

    if(myTasks.length === 0){
      panel.innerHTML = `
        <div class="empty-state">
          <span class="emj">✅</span>
          <div class="t">Nessun turno per te</div>
          <div class="s">Goditi la giornata — controlla comunque il programma generale nel gruppo.</div>
        </div>`;
      return;
    }

    myTasks.forEach(t => {
      const teammates = t.people.filter(p => p !== person);
      const matesText = teammates.length
        ? `Con <b>${teammates.join(", ")}</b>`
        : `Sei tu l'unico responsabile`;
      const row = document.createElement("div");
      row.className = "task-row";
      row.innerHTML = `
        <div class="icon">${t.icon}</div>
        <div class="body">
          <div class="t">${t.title}</div>
          <div class="mates">${matesText}</div>
        </div>`;
      panel.appendChild(row);
    });
  }

  function showPass(person){
    passName.textContent = "Ciao, " + person + " 👋";
    passSub.textContent = "Ecco i tuoi turni per venerdì, sabato e domenica.";

    let totalTasks = 0;
    let daysWithTasks = 0;

    Object.keys(DAYS).forEach(dayKey => {
      buildPanel(dayKey, person);
      const count = DAYS[dayKey].tasks.filter(t => t.people.includes(person)).length;
      document.getElementById("badge-" + dayKey).textContent = count;
      if(count > 0){ totalTasks += count; daysWithTasks += 1; }
    });

    tally.innerHTML = `
      <div class="tally-item"><span class="n">${totalTasks}</span>turni assegnati</div>
      <div class="tally-item"><span class="n">${daysWithTasks}</span>giorni coinvolti</div>
    `;

    let firstDay = "venerdi";
    for(const dayKey of ["venerdi","sabato","domenica"]){
      if(DAYS[dayKey].tasks.some(t => t.people.includes(person))){ firstDay = dayKey; break; }
    }
    activateTab(firstDay);

    checkin.style.display = "none";
    pass.style.display = "block";

    try{ localStorage.setItem("esn_weekend_name", person); }catch(e){}
  }

  function showOverview(){
    passName.textContent = "Programma generale 📋";
    passSub.textContent = "Tutti i compiti del weekend, con chi è assegnato a ciascuno.";

    let totalTasks = 0;
    let unfilled = 0;

    Object.keys(DAYS).forEach(dayKey => {
      buildPanel(dayKey, null);
      const dayTasks = DAYS[dayKey].tasks;
      document.getElementById("badge-" + dayKey).textContent = dayTasks.length;
      totalTasks += dayTasks.length;
      unfilled += dayTasks.filter(t => t.people.length === 0).length;
    });

    tally.innerHTML = `
      <div class="tally-item"><span class="n">${totalTasks}</span>compiti totali</div>
      <div class="tally-item"><span class="n">${unfilled}</span>da assegnare</div>
    `;

    activateTab("venerdi");

    checkin.style.display = "none";
    pass.style.display = "block";
  }

  function activateTab(dayKey){
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.day === dayKey));
    document.querySelectorAll(".daypanel").forEach(p => p.classList.toggle("active", p.dataset.day === dayKey));
  }

  document.getElementById("tabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".tab");
    if(!btn) return;
    activateTab(btn.dataset.day);
  });

  function attemptEnter(){
    if(OVERVIEW_TRIGGERS.includes(normalize(input.value))){
      errorMsg.textContent = "";
      showOverview();
      return;
    }
    const person = findPerson(input.value);
    if(!person){
      errorMsg.textContent = "Non trovo questo nome nella squadra — controlla come è scritto.";
      return;
    }
    errorMsg.textContent = "";
    showPass(person);
  }

  goBtn.addEventListener("click", attemptEnter);
  input.addEventListener("keydown", (e) => { if(e.key === "Enter") attemptEnter(); });
  overviewLink.addEventListener("click", showOverview);

  backBtn.addEventListener("click", () => {
    pass.style.display = "none";
    checkin.style.display = "block";
    input.value = "";
    input.focus();
  });

  try{
    const saved = localStorage.getItem("esn_weekend_name");
    if(saved && PEOPLE.includes(saved)){
      input.value = saved;
    }
  }catch(e){}

})();
</script>
</body>
</html>
